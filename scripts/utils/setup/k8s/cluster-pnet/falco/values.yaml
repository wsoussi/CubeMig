collectors:
  enabled: true
customRules:
  zz_ba_noise_filters.yaml: |-
    - rule: Contact K8S API Server From Container
      override:
        condition: append
      condition: >
        and not (
          k8s.ns.name = "kube-flannel" and
          container.name = "kube-flannel" and
          proc.name = "flanneld"
        )

    - rule: Packet socket created in container
      override:
        condition: append
      condition: >
        and not (
          k8s.ns.name = "kube-system" and
          container.name = "kube-vip" and
          proc.name = "kube-vip"
        )
driver:
  enabled: true
falco:
  buffered_outputs: false
  http_output:
    enabled: true
    url: http://10.10.10.1:8000/alert
  json_include_output_property: true
  json_output: true
  stdout_output:
    enabled: true
falcosidekick:
  enabled: false
tty: true









set -euo pipefail

BASE="configs"
TS="$(date +%Y%m%d-%H%M%S)"

mkdir -p \
  "$BASE/helm-values/cluster2" \
  "$BASE/helm-values/cluster-sev-snp" \
  "$BASE/istio/cluster2" \
  "$BASE/istio/cluster-sev-snp" \
  "$BASE/network/cluster2/kube-vip"

export_helm_values() {
  local ctx="$1"
  local outdir="$2"

  echo "== Helm releases on $ctx =="
  helm list --kube-context "$ctx" -A | grep -Ei 'istio|gateway|falco' || true

  echo "== Exporting Helm values from $ctx =="

  while IFS=$'\t' read -r ns rel; do
    [ -n "$ns" ] || continue
    [ -n "$rel" ] || continue

    echo "Exporting $ctx/$ns/$rel"
    helm get values "$rel" \
      --kube-context "$ctx" \
      -n "$ns" \
      -o yaml \
      > "$outdir/${ns}-${rel}-values.yaml"
  done < <(
    helm list --kube-context "$ctx" -A -o json \
      | jq -r '.[] | select(.name | test("istiod|istio-base|eastwest|east-west|gateway|falco"; "i")) | [.namespace, .name] | @tsv'
  )
}

export_istio_gateway_service() {
  local ctx="$1"
  local outdir="$2"

  echo "== Exporting istio-eastwestgateway Service from $ctx =="

  kubectl --context "$ctx" -n istio-system get svc istio-eastwestgateway -o yaml \
    > "$outdir/istio-eastwestgateway-service.raw.yaml"

  kubectl --context "$ctx" -n istio-system get deploy istio-eastwestgateway -o yaml \
    > "$outdir/istio-eastwestgateway-deployment.raw.yaml"
}

export_kube_vip_cluster2() {
  local ctx="cluster2"
  local outdir="$BASE/network/cluster2/kube-vip"

  echo "== Exporting kube-vip resources from cluster2 =="

  kubectl --context "$ctx" get ns kube-vip-system >/dev/null 2>&1 && KVIP_NS="kube-vip-system" || KVIP_NS="kube-system"

  echo "$KVIP_NS" > "$outdir/namespace.txt"

  kubectl --context "$ctx" -n "$KVIP_NS" get all,cm,sa,role,rolebinding,clusterrole,clusterrolebinding \
    -l app.kubernetes.io/name=kube-vip \
    -o yaml > "$outdir/kube-vip-labeled-resources.raw.yaml" || true

  kubectl --context "$ctx" -n "$KVIP_NS" get ds,deploy,cm,sa -o yaml \
    | awk '
      /kube-vip/ {found=1}
      found {print}
    ' > "$outdir/kube-vip-namespace-scan.raw.yaml" || true

  kubectl --context "$ctx" -A get pods,svc,cm,ds,deploy \
    | grep -i kube-vip > "$outdir/kube-vip-inventory.txt" || true

  kubectl --context "$ctx" get svc -A -o yaml \
    | grep -C 8 -Ei 'kube-vip|loadbalancerIPs|vipHost|10\.0\.0\.50' \
    > "$outdir/kube-vip-related-services-snippets.txt" || true
}

export_helm_values "cluster2" "$BASE/helm-values/cluster2"
export_helm_values "cluster-sev-snp" "$BASE/helm-values/cluster-sev-snp"

export_istio_gateway_service "cluster2" "$BASE/istio/cluster2"
export_istio_gateway_service "cluster-sev-snp" "$BASE/istio/cluster-sev-snp"

export_kube_vip_cluster2

echo
echo "== Export complete =="
find "$BASE/helm-values/cluster2" "$BASE/helm-values/cluster-sev-snp" "$BASE/istio/cluster2" "$BASE/istio/cluster-sev-snp" "$BASE/network/cluster2/kube-vip" -type f | sort
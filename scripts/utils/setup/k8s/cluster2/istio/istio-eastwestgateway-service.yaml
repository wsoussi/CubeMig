---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kube-vip.io/loadbalancerIPs: 10.0.0.60
    kube-vip.io/vipHost: worker3
    meta.helm.sh/release-name: istio-eastwestgateway
    meta.helm.sh/release-namespace: istio-system
  labels:
    app: istio-eastwestgateway
    app.kubernetes.io/instance: istio-eastwestgateway
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: istio-eastwestgateway
    app.kubernetes.io/part-of: istio
    app.kubernetes.io/version: 1.27.2
    helm.sh/chart: gateway-1.27.2
    istio: eastwestgateway
    istio.io/dataplane-mode: none
    topology.istio.io/network: network2
  name: istio-eastwestgateway
  namespace: istio-system
spec:
  allocateLoadBalancerNodePorts: true
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: status-port
    port: 15021
    protocol: TCP
    targetPort: 15021
  - name: tls
    port: 15443
    protocol: TCP
    targetPort: 15443
  - name: tls-istiod
    port: 15012
    protocol: TCP
    targetPort: 15012
  - name: tls-webhook
    port: 15017
    protocol: TCP
    targetPort: 15017
  selector:
    app: istio-eastwestgateway
    istio: eastwestgateway
  sessionAffinity: None
  type: LoadBalancer

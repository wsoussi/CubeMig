---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip-ds
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-vip
    spec:
      containers:
      - args:
        - manager
        env:
        - name: svc_enable
          value: 'true'
        - name: vip_arp
          value: 'true'
        - name: vip_leaderelection
          value: 'true'
        - name: svc_election
          value: 'true'
        - name: cp_namespace
          value: kube-system
        - name: vip_interface
          value: ens3
        image: ghcr.io/kube-vip/kube-vip:v0.8.9
        name: kube-vip
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
      hostNetwork: true
      serviceAccountName: kube-vip
      terminationGracePeriodSeconds: 10
      tolerations:
      - operator: Exists
